name: Hello Actions

on:
  push:
    branches: [ main ]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      

      - name: Print message
        run: echo "Hello, Jake! Workflow is running."

      - name: Check file exists
        run: test -f Trip_Summary.md && echo "File found"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check script
        run: python check_trip.py
